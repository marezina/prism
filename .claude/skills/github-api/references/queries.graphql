# Canonical query shapes. Go structs in internal/gh/queries must mirror these.

# 1) Watch set — run per search string, paginate with `after`.
query WatchSet($q: String!, $after: String) {
  rateLimit { cost remaining resetAt }
  search(query: $q, type: ISSUE, first: 100, after: $after) {
    pageInfo { hasNextPage endCursor }
    nodes { ... on PullRequest { id isDraft } }
  }
}

# 2) Snapshots by id (≤ 50 ids per call)
query Snapshots($ids: [ID!]!) {
  rateLimit { cost remaining resetAt }
  nodes(ids: $ids) { ... on PullRequest { ...PRSnapshot } }
}

fragment Actor on Actor { __typename login avatarUrl(size: 96) }

fragment PRSnapshot on PullRequest {
  id number title url state isDraft merged createdAt updatedAt closedAt
  repository { nameWithOwner owner { login } }
  author { ...Actor }
  headRefOid baseRefOid
  mergeable mergeStateStatus
  commits(last: 1) {
    totalCount
    nodes { commit { oid statusCheckRollup {
      state
      contexts(first: 50) { nodes {
        __typename
        ... on CheckRun { name conclusion status detailsUrl completedAt }
        ... on StatusContext { context state targetUrl createdAt }
      } }
    } } }
  }
  reviews(last: 50) {
    pageInfo { hasPreviousPage startCursor }
    nodes { id databaseId state body url submittedAt author { ...Actor } commit { oid } }
  }
  comments(last: 50) {
    pageInfo { hasPreviousPage startCursor }
    nodes { id databaseId body url createdAt author { ...Actor } }
  }
  reviewThreads(last: 50) {
    pageInfo { hasPreviousPage startCursor }
    nodes {
      id isResolved path
      comments(first: 50) {
        pageInfo { hasNextPage endCursor }
        nodes { id databaseId body url createdAt author { ...Actor } replyTo { id }
                pullRequestReview { databaseId } }
      }
    }
  }
  reviewRequests(first: 20) {
    nodes { requestedReviewer {
      __typename
      ... on User { login }
      ... on Team { slug organization { login } }
    } }
  }
  timelineItems(last: 30, itemTypes: [REVIEW_REQUESTED_EVENT, HEAD_REF_FORCE_PUSHED_EVENT]) {
    nodes {
      __typename
      ... on ReviewRequestedEvent { id createdAt actor { ...Actor }
        requestedReviewer { __typename ... on User { login } ... on Team { slug organization { login } } } }
      ... on HeadRefForcePushedEvent { id createdAt actor { ...Actor } afterCommit { oid } }
    }
  }
}

# 3) Resolve owner/repo#n (prism-cli record)
query PRByNumber($owner: String!, $name: String!, $number: Int!) {
  rateLimit { cost remaining resetAt }
  repository(owner: $owner, name: $name) { pullRequest(number: $number) { id } }
}

# 4) Older pages of one connection, only when the first page was full
query ReviewsPage($id: ID!, $before: String) {
  rateLimit { cost remaining resetAt }
  node(id: $id) { ... on PullRequest { reviews(last: 50, before: $before) {
    pageInfo { hasPreviousPage startCursor } nodes { ...same fields as above } } } }
}
# CommentsPage / ThreadsPage: same shape for comments / reviewThreads.
query ThreadCommentsPage($id: ID!, $after: String) {
  rateLimit { cost remaining resetAt }
  node(id: $id) { ... on PullRequestReviewThread { comments(first: 50, after: $after) {
    pageInfo { hasNextPage endCursor } nodes { ...same fields as above } } } }
}

# Notes
# - `last:` keeps the newest items; internal/gh paginates backwards with
#   hasPreviousPage (≤ 20 extra pages per connection) so snapshots are complete.
# - GraphQL errors null out single nodes (e.g. FORBIDDEN under SAML); the rest of
#   the batch is still decoded and used.
# - Verify field availability in P1 against the live schema (GitHub GraphQL explorer).
